<!doctype html>
<html lang="fr" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title></title>

  <!-- Stabilise les dimensions dans Outlook Windows avec une mise à l'échelle de l'écran. -->
  <!--[if mso]>
  <xml>
    <o:OfficeDocumentSettings>
      <o:AllowPNG/>
      <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
  </xml>
  <![endif]-->

  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #F5F5F7;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    table {
      border: 0;
      border-collapse: collapse;
      border-spacing: 0;
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }
    td, th {
      border: 0;
      mso-border-alt: none;
    }
    img {
      border: 0;
      outline: none;
      text-decoration: none;
      -ms-interpolation-mode: bicubic;
      display: block;
      max-width: 100%;
      height: auto;
    }
    .email-content p {
      margin: 0 0 16px 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
      line-height: 26px;
      mso-line-height-rule: at-least;
      text-align: justify;
    }
    .email-content h1, .email-content h2, .email-content h3 {
      margin: 0 0 16px 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #11458c;
      text-align: left;
    }
    .email-content h1 { font-size: 24px; line-height: 32px; }
    .email-content h2 { font-size: 21px; line-height: 28px; }
    .email-content h3 { font-size: 19px; line-height: 26px; }
    .email-content ul, .email-content ol {
      margin: 0 0 16px 0;
      padding-left: 24px;
    }
    .email-content li { margin: 0 0 8px 0; }
    .email-content table {
      max-width: 100%;
    }
    .email-content td, .email-content th {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
      line-height: 26px;
      color: #1e173a;
    }
    a { color: #11458c; text-decoration: underline; }
    a[x-apple-data-detectors] { color: inherit !important; font: inherit !important; }

    @media screen and (max-width: 600px) {
      .email-outer { padding: 16px 8px !important; }
      .email-content { padding: 24px 20px 16px 20px !important; }
      .email-signature { padding: 0 20px 24px 20px !important; }
    }
  </style>
</head>
<body bgcolor="#F5F5F7" style="margin:0; padding:0; width:100%; background-color:#F5F5F7; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">

  <!-- Préheader masqué, conservé pour l'aperçu dans la boîte de réception. -->
  <div style="display:none; visibility:hidden; font-size:1px; line-height:1px; height:0; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all;">
    {{ summary }}
  </div>

  <!-- Les styles essentiels sont en ligne, avec des attributs HTML de secours. -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="#F5F5F7"
         style="width:100%; background-color:#F5F5F7; border:0; border-collapse:collapse; border-spacing:0; mso-table-lspace:0pt; mso-table-rspace:0pt;">
    <tr>
      <td class="email-outer" align="center" valign="top" style="padding:32px 16px; border:0; mso-border-alt:none;">

        <!-- Outlook classique utilise ce cadre fixe à la place de max-width. -->
        <!--[if mso]>
        <table role="presentation" width="720" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="#FFFFFF"
               style="width:720px; background-color:#FFFFFF; border:0; border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">
          <tr>
            <td valign="top" style="padding:0; border:0; mso-border-alt:none;">
        <![endif]-->

        <!-- Le fond bleu et l'espacement de 1 px forment le cadre sans bordure CSS. -->
        <table class="email-frame" role="presentation" width="100%" cellpadding="1" cellspacing="0" border="0" align="center" bgcolor="#002654"
               style="width:100%; max-width:720px; background-color:#002654; border:0; border-collapse:separate; border-spacing:0; mso-table-lspace:0pt; mso-table-rspace:0pt;">
          <tr>
            <td bgcolor="#002654" style="padding:1px; border:0; mso-border-alt:none; background-color:#002654;">

              <!-- Carte blanche à l'intérieur du cadre bleu. -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="#FFFFFF"
                     style="width:100%; table-layout:fixed; background-color:#FFFFFF; border:0; border-collapse:collapse; border-spacing:0; mso-table-lspace:0pt; mso-table-rspace:0pt;">
                <tr>
                  <td class="email-content" align="justify" valign="top" bgcolor="#FFFFFF"
                      style="padding:32px 32px 24px 32px; border:0; mso-border-alt:none; background-color:#FFFFFF; font-family:Arial, Helvetica, sans-serif; font-size:17px; line-height:26px; mso-line-height-rule:at-least; color:#1e173a; text-align:justify; overflow-wrap:break-word;">
                    {{ content | safe }}
                  </td>
                </tr>
                <tr>
                  <td class="email-signature" align="left" valign="top" bgcolor="#FFFFFF"
                      style="padding:0 32px 32px 32px; border:0; mso-border-alt:none; background-color:#FFFFFF; font-family:Arial, Helvetica, sans-serif; font-size:17px; line-height:26px; mso-line-height-rule:at-least; color:#1e173a; text-align:left;">
                    <strong>{% if author is defined %}{{ author }}{% else %}Florent TOURNOIS{% endif %}</strong><br>
                    <i style="color:#4e3568; font-size:15px;">
                      {% if role is defined %}{{ role }}{% else %}Coordinator{% endif %}
                    </i>
                  </td>
                </tr>
              </table>

            </td>
          </tr>
        </table>

        <!--[if mso]>
            </td>
          </tr>
        </table>
        <![endif]-->

      </td>
    </tr>
  </table>

</body>
</html>
