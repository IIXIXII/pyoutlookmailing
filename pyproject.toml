[build-system]
requires = ["setuptools>=83", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoutlookmailing"
dynamic = ["version"]
description = "Prepare Markdown emails and deliver them through classic Outlook"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Florent Tournois", email = "florent.tournois@gmail.fr"}]
dependencies = [
  "pymdtools>=3.0.0,<4",
  "upref>=2.2.0,<3",
  "mistune>=3.3.4,<4",
  "Jinja2>=3.1.6,<4",
  "MarkupSafe>=2.1,<4",
  "PyYAML>=6.0.2,<7",
  "pandas>=2.2.3,<4",
  "openpyxl>=3.1.5,<4",
  "pywin32>=311; sys_platform == 'win32'",
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.12,<1",
  "build>=1.2,<2", "twine>=6,<7", "pip-audit>=2.9,<3",
  "beautifulsoup4>=4.12,<5",
  "pyright[nodejs]>=1.1.414,<2",
]

[project.urls]
Source = "https://github.com/IIXIXII/pyoutlookmailing"
Issues = "https://github.com/IIXIXII/pyoutlookmailing/issues"

[project.scripts]
pyoutlookmailing = "pyoutlookmailing.cli:main"

[tool.setuptools.packages.find]
include = ["pyoutlookmailing", "pyoutlookmailing.*"]

[tool.setuptools.dynamic]
version = {attr = "pyoutlookmailing.version.__version__"}

[tool.setuptools.package-data]
pyoutlookmailing = ["default.conf", "templates/*.html", "templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.pyright]
include = ["pyoutlookmailing", "scripts", "tests", "setup.py"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["pyoutlookmailing"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 80
extend-exclude = ["tests/__archives__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "B", "UP"]
# Keep the explicit UTF-8 declaration required by the project's Python header.
ignore = ["UP009"]

[tool.ruff.lint.per-file-ignores]
"pyoutlookmailing/__init__.py" = ["F401"]
