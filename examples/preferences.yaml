# Import with: python -m pyoutlookmailing.preferences --import examples/preferences.yaml
# Set your sender here before importing, or leave it out to use Outlook's default.
# from: sender@example.org
paths:
  root: ../
  jinja: template/jinja
  template: template/html
  img: template/img
email:
  template: email.html
profiles:
  ebw:
    email:
      template: std3.html
  aptitude:
    email:
      template: aptitude vff.html
      model: apt
  unfold:
    email:
      template: unfold v2.html
      model: unfold
  isac:
    email:
      template: isac.html
      model: isac
      lang: en
      brand: "ISAC 4 Identity & Trust Services"
      eyebrow: "Information Sharing & Analysis Centre"
      author: "Florent Tournois"
      role: ""
      signoff: "Yours sincerely,"
      contact_email: "contact@isac4id.eu"
      website_url: "https://isac4id.eu"
      website_label: "isac4id.eu"
      isac_width: 800
